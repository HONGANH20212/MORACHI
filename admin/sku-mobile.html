<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MORACHI · Kho SKU & Tồn kho</title>
<style>
:root {
  --navy: #202938;
  --navy2: #2e394c;
  --orange: #f67823;
  --body: #f5f6f9;
  --muted: #758090;
  --text: #222a35;
  --green: #16875a;
  --red: #ce4747;
  --amber: #b87113;
  --line: #e7e9ee;
}
* { box-sizing: border-box; }
html {
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #e8eaf0;
  color: var(--text);
}
body { margin: 0; }
button, input { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid #ffb471; outline-offset: 2px; }

#app {
  width: min(100%, 460px);
  margin: 0 auto;
  min-height: 100svh;
  background: var(--body);
  box-shadow: 0 10px 50px #15213022;
  padding-bottom: 93px;
}
.top {
  background: var(--navy);
  color: #fff;
  border-radius: 0 0 22px 22px;
  padding: 16px 15px;
}
.topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.identity {
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo {
  width: 40px;
  height: 40px;
  background: #ffffff17;
  border: 1px solid #ffffff22;
  border-radius: 13px;
  display: grid;
  place-items: center;
  color: white;
  font-weight: 800;
  font-size: 19px;
}
.brand {
  font-size: 18px;
  font-weight: 850;
  letter-spacing: .4px;
}
.subbrand {
  font-size: 11px;
  color: #bbc4d0;
  margin-top: 3px;
}
.env-tag {
  border-radius: 999px;
  padding: 5px 10px;
  font-size: 10px;
  background: #ffffff15;
  border: 1px solid #ffffff33;
  color: #fff;
  font-weight: 700;
}
.overview {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-top: 15px;
}
.metric {
  background: #ffffff13;
  border: 1px solid #ffffff16;
  border-radius: 13px;
  padding: 10px 8px;
  text-align: center;
}
.metric .num { font-size: 20px; font-weight: 850; }
.metric .lab { font-size: 10px; color: #bdc5d2; margin-top: 3px; }

.toolbar {
  position: sticky;
  top: 0;
  background: var(--body);
  z-index: 12;
  padding: 12px 13px 8px;
}
.search {
  border: 1px solid #e2e5eb;
  background: white;
  border-radius: 14px;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 11px 12px;
}
.search input {
  border: 0;
  outline: 0;
  width: 100%;
  background: transparent;
  font-size: 13px;
}
.search input::placeholder { color: #9aa2af; }
.filterbar {
  display: flex;
  gap: 7px;
  margin-top: 10px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 4px;
}
.filterbar::-webkit-scrollbar { display: none; }
.filter {
  border: 1px solid #e7e9ee;
  background: #fff;
  color: #525c69;
  border-radius: 99px;
  padding: 8px 12px;
  font-size: 11px;
  font-weight: 750;
  white-space: nowrap;
}
.filter.active {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
}

.content { padding: 5px 13px 16px; }
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 5px 0 12px;
}
.section-head strong { font-size: 15px; }
.head-side { display: flex; align-items: center; gap: 8px; }
.result-count { color: #7f8998; font-size: 11px; }
.layoutbtn {
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line);
  background: #fff;
  width: 34px;
  height: 33px;
  border-radius: 10px;
  font-size: 14px;
  color: #566273;
}
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 9px;
}
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.product {
  min-width: 0;
  text-align: left;
  border: 1px solid #e8eaf0;
  background: #fff;
  border-radius: 15px;
  padding: 6px 6px 9px;
  box-shadow: 0 3px 13px #1b233309;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  color: var(--text);
}
.product:active { transform: scale(.98); }
.photo {
  aspect-ratio: 1/1;
  width: 100%;
  object-fit: contain;
  background: #f9fafb;
  border-radius: 11px;
  display: block;
}
.corner {
  position: absolute;
  top: 10px;
  right: 10px;
  min-width: 21px;
  height: 21px;
  padding: 0 5px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 800;
  box-shadow: 0 1px 4px #0002;
  background: #fff;
}
.corner.low { color: var(--amber); }
.corner.out { color: var(--red); }
.corner.good { color: var(--green); }
.pbrand {
  font-size: 9px;
  letter-spacing: .4px;
  font-weight: 800;
  color: #8b93a0;
  padding: 0 2px;
  margin-top: 8px;
}
.pname {
  font-size: 11.5px;
  font-weight: 750;
  line-height: 1.34;
  margin: 3px 2px 0;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  height: 31px;
}
.pbottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 8px 2px 0;
  gap: 3px;
}
.variant-pill {
  color: #9b6020;
  background: #fff4e9;
  border-radius: 99px;
  padding: 3px 6px;
  font-size: 9px;
  font-weight: 800;
}
.remain { font-size: 10px; color: #747f8f; font-weight: 700; }
.empty {
  text-align: center;
  color: var(--muted);
  padding: 50px 14px;
  font-size: 13px;
  grid-column: 1/-1;
}

/* MODAL CHI TIẾT SKU */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: #141a2699;
  z-index: 40;
}
.overlay.show { display: block; }
.sheet {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translate(-50%, 105%);
  width: min(100%, 460px);
  max-height: 92svh;
  overflow-y: auto;
  background: #fff;
  border-radius: 25px 25px 0 0;
  z-index: 41;
  transition: transform .24s ease;
  padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
  overscroll-behavior: contain;
}
.sheet.show { transform: translate(-50%, 0); }
.handle {
  width: 42px;
  height: 5px;
  border-radius: 99px;
  background: #e0e3e9;
  margin: 0 auto 13px;
}
.sheet-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.sheet-image {
  width: 75px;
  height: 75px;
  border-radius: 13px;
  background: #fafafa;
  object-fit: contain;
  border: 1px solid #edf0f2;
  flex: none;
}
.sheet-copy { min-width: 0; flex: 1; }
.sheet-copy h2 { font-size: 15px; line-height: 1.3; margin: 2px 0 4px; }
.sheet-copy .brandname { color: #8a93a1; font-size: 11px; font-weight: 700; }
.close {
  border: 0;
  background: #f4f6f8;
  color: #617083;
  border-radius: 10px;
  width: 31px;
  height: 31px;
  font-size: 22px;
  line-height: 1;
  flex: none;
}
.variant-row {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 12px 0 6px;
}
.variant-row::-webkit-scrollbar { display: none; }
.variant-btn {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 12px;
  min-width: 120px;
  max-width: 180px;
  text-align: left;
  padding: 8px 10px;
  color: var(--text);
  flex: none;
}
.variant-btn.active {
  border-color: #f79c56;
  background: #fff7f0;
  box-shadow: inset 0 0 0 1px #f79c56;
}
.sku-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #fff8f3;
  border: 1px solid #fedec8;
  color: #bc550b;
  font-weight: 800;
  font-size: 12px;
  border-radius: 99px;
  padding: 6px 12px;
  margin: 6px 0;
}
.sku-tags {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.status-pill {
  padding: 5px 10px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 800;
}
.status-pill.good { background: #e8f8f0; color: var(--green); }
.status-pill.low { background: #fef5e7; color: var(--amber); }
.status-pill.out { background: #fdedec; color: var(--red); }

.info-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}
.info-box {
  background: #f8f9fc;
  border: 1px solid #e6e9f0;
  padding: 11px 12px;
  border-radius: 14px;
}
.info-box small { display: block; color: #768292; font-size: 11px; margin-bottom: 4px; }
.info-box strong { font-size: 17px; font-weight: 850; }

.actrow {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin: 15px 0 0;
}
.btn {
  border-radius: 13px;
  padding: 13px 10px;
  font-weight: 800;
  font-size: 13px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--text);
}
.btn.primary {
  background: var(--orange);
  color: #fff;
  border-color: var(--orange);
}

.edit-area {
  background: #f9fafc;
  border: 1px solid #e9ecf1;
  border-radius: 15px;
  padding: 13px;
  margin-top: 14px;
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.field label {
  display: block;
  font-size: 11px;
  font-weight: 750;
  color: #677485;
  margin-bottom: 5px;
}
.field input {
  width: 100%;
  background: #fff;
  border: 1px solid #dee3ea;
  border-radius: 10px;
  padding: 10px 9px;
  font-size: 14px;
  outline: none;
}
.field input:focus { border-color: var(--orange); }
.calc {
  background: #fff5ea;
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 12px;
  margin-top: 10px;
  color: #8a5617;
  display: flex;
  justify-content: space-between;
  font-weight: 700;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 85px;
  transform: translateX(-50%);
  background: #253448;
  color: #fff;
  font-size: 12px;
  border-radius: 12px;
  padding: 12px 18px;
  z-index: 60;
  box-shadow: 0 12px 30px #0003;
  max-width: 90vw;
  text-align: center;
}
.hidden { display: none !important; }
body.lock { overflow: hidden; }
</style>

<body>
<div id="app">
  <header class="top">
    <div class="topline">
      <div class="identity">
        <div class="logo">M</div>
        <div>
          <div class="brand">MORACHI</div>
          <div class="subbrand">Kho SKU & Tồn kho</div>
        </div>
      </div>
      <div class="env-tag" id="envTag">COSMOS DB</div>
    </div>
    <div class="overview">
      <div class="metric"><div class="num" id="sumProducts">0</div><div class="lab">Sản phẩm</div></div>
      <div class="metric"><div class="num" id="sumLow">0</div><div class="lab">Sắp hết</div></div>
      <div class="metric"><div class="num" id="sumOut">0</div><div class="lab">Hết hàng</div></div>
    </div>
  </header>

  <div class="toolbar">
    <label class="search" aria-label="Tìm sản phẩm">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8e99a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input id="q" placeholder="Tìm tên, mã SKU, màu, thương hiệu..." autocomplete="off"/>
    </label>
    <div class="filterbar" id="filterBar">
      <button type="button" class="filter active" data-filter="all">Tất cả</button>

  <main class="content">
    <div class="section-head">
      <strong>Danh sách sản phẩm</strong>
      <div class="head-side">
        <span class="result-count" id="resultCount">Đang tải...</span>
        <button class="layoutbtn" id="layoutToggle" title="Đổi số cột">▦</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<!-- MODAL POPUP CHI TIẾT & CHỈNH SỬA SKU -->
<div class="overlay" id="overlay"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="handle"></div>
  <div class="sheet-header">
    <img id="sheetImage" class="sheet-image" alt=""/>
    <div class="sheet-copy">
      <h2 id="modalTitle"></h2>
      <div class="brandname" id="sheetBrand"></div>
    </div>
    <button class="close" id="close" aria-label="Đóng">×</button>
  </div>
  
  <div style="font-size:12px;font-weight:750;margin-top:14px;color:#556172;">Chọn phân loại / màu</div>
  <div class="variant-row" id="variantRow"></div>

  <div style="margin:10px 0;">
    <div class="sku-badge" id="skuBadge">🏷 SKU: —</div>
  </div>
  
  <div class="sku-tags" id="skuTags"></div>

  <div class="info-grid">
    <div class="info-box"><small>Giá nhập</small><strong id="yenVal">¥0</strong></div>
    <div class="info-box"><small>Giá vốn (×170)</small><strong id="cogsVal">0 đ</strong></div>
    <div class="info-box"><small>Tồn kho</small><strong id="stockVal">0</strong></div>
    <div class="info-box"><small>Ngưỡng cảnh báo</small><strong id="minVal">5</strong></div>
  </div>

  <div class="actrow">
    <button type="button" class="btn" id="editBtn">Chỉnh sửa</button>
    <button type="button" class="btn primary" id="receiveBtn">Nhập thêm</button>
  </div>

  <div class="edit-area hidden" id="editArea">
    <div style="font-size:13px;font-weight:800;margin-bottom:10px;" id="editTitle">Chỉnh sửa SKU</div>
    <div class="form-grid" id="editGrid"></div>
    <div id="computed" class="calc"></div>
    <button type="button" class="btn primary" style="width:100%;margin-top:12px;" id="saveBtn">Lưu thay đổi</button>
  </div>
</section>

<script>
(() => {
  'use strict';
  const RATE = 170;
  const $ = id => document.getElementById(id);
  const fmt = n => Number(n || 0).toLocaleString('vi-VN');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  let rawProducts = [];
  let filter = 'all';
  let curProduct = null;
  let curVariantIdx = 0;
  let curMode = null;
  let isSaving = false;

  const getMinStock = v => Number(v.min_stock ?? v.low_stock_threshold ?? 5);
  const getStockStatus = v => {
    const s = Number(v.stock || 0);
    const m = getMinStock(v);
    if (s <= 0) return 'out';
    if (s <= m) return 'low';
    return 'good';
  };

  async function loadData() {
    try {
      $('resultCount').textContent = 'Đang đồng bộ dữ liệu...';

      // 1. Quét nền tự động cấp SKU cho tất cả phân loại còn thiếu trong DB
      try {
        fetch('/api/manage/sku/auto-assign-all', { method: 'POST' }).catch(() => {});
      } catch (err) {}

      // 2. Tải danh sách sản phẩm mới nhất
      const res = await fetch('/api/manage/products?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      rawProducts = await res.json();
      if (!Array.isArray(rawProducts)) rawProducts = [];

      buildBrandFilters();
      renderStats();
      renderGrid();
    } catch (e) {
      console.error(e);
      $('grid').innerHTML = '<div class="empty">Lỗi kết nối máy chủ hoặc API.</div>';
    }
  }

  function buildBrandFilters() {
    const brands = [...new Set(rawProducts.map(p => p.brand).filter(Boolean))].sort();
    const bar = $('filterBar');
    bar.querySelectorAll('.brand-chip').forEach(c => c.remove());
    brands.forEach(b => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'filter brand-chip';
      btn.dataset.filter = b;
      btn.textContent = b;
      bar.appendChild(btn);
    });
  }

  function renderStats() {
    let lowCount = 0, outCount = 0;
    rawProducts.forEach(p => {
      (p.variants || []).forEach(v => {
        const st = getStockStatus(v);
        if (st === 'out') outCount++;
        else if (st === 'low') lowCount++;
      });
    });
    $('sumProducts').textContent = rawProducts.length;
    $('sumLow').textContent = lowCount;
    $('sumOut').textContent = outCount;
  }

  function renderGrid() {
    const q = $('q').value.trim().toLowerCase();
    const list = rawProducts.filter(p => {
      const vars = p.variants || [];
      const textMatch = [p.title, p.brand, p.category, ...vars.map(v => (v.sku || '') + ' ' + (v.name || ''))]
        .join(' ').toLowerCase().includes(q);

      let filterMatch = true;
      if (filter === 'low') filterMatch = vars.some(v => getStockStatus(v) === 'low');
      else if (filter === 'out') filterMatch = vars.some(v => getStockStatus(v) === 'out');
      else if (filter !== 'all') filterMatch = p.brand === filter;

      return textMatch && filterMatch;
    });

    $('resultCount').textContent = `${list.length} sản phẩm`;
    if (!list.length) {
      $('grid').innerHTML = '<div class="empty">Không tìm thấy sản phẩm phù hợp.</div>';
      return;
    }

    $('grid').innerHTML = list.map(p => {
      const vars = p.variants || [];
      const totalStock = vars.reduce((s, v) => s + (parseInt(v.stock) || 0), 0);
      const hasOut = vars.some(v => getStockStatus(v) === 'out');
      const hasLow = vars.some(v => getStockStatus(v) === 'low');
      const badge = hasOut ? '<span class="corner out">Hết</span>' : hasLow ? '<span class="corner low">!</span>' : '<span class="corner good">✓</span>';

      return `
        <button class="product" data-id="${esc(p.id)}" type="button">
          <img class="photo" src="${esc(p.thumbnail || '/images/icon-logo.png')}" alt="" onerror="this.src='/images/icon-logo.png'"/>
          ${badge}
          <div class="pbrand">${esc(p.brand || 'MORACHI')}</div>
          <div class="pname">${esc(p.title || 'Sản phẩm')}</div>
          <div class="pbottom">
            <span class="variant-pill">${vars.length} màu</span>
            <span class="remain">Kho ${totalStock}</span>
          </div>
        </button>
      `;
    }).join('');
  }

  // Tự động cấp SKU ngay cho sản phẩm nếu chưa có SKU
  async function ensureCurrentVariantSku() {
    if (!curProduct) return null;
    const v = curProduct.variants[curVariantIdx];
    if (v && v.sku && String(v.sku).trim()) {
      return v.sku;
    }

    toast('Đang tự động cấp mã SKU mới...');
    try {
      const res = await fetch('/api/manage/sku/ensure', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          product_id: curProduct.id,
          expected_etag: curProduct._etag
        })
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        const ref = await fetch('/api/manage/products?t=' + Date.now(), { cache: 'no-store' });
        if (ref.ok) {
          rawProducts = await ref.json();
          curProduct = rawProducts.find(x => x.id === curProduct.id) || curProduct;
          renderSheetDetails();
          renderGrid();
          return curProduct.variants[curVariantIdx]?.sku;
        }
      }
    } catch (err) {
      console.error('Không cấp được SKU:', err);
    }
    return null;
  }

  window.forceGenerateSku = async function() {
    const code = await ensureCurrentVariantSku();
    if (code) {
      toast('✓ Đã cấp mã SKU: ' + code);
    } else {
      toast('❌ Không thể kết nối API cấp SKU, hãy kiểm tra lại kết nối');
    }
  };

  async function openSheet(p) {
    curProduct = p;
    curVariantIdx = 0;
    curMode = null;
    $('editArea').classList.add('hidden');
    $('sheetImage').src = p.thumbnail || '/images/icon-logo.png';
    $('modalTitle').textContent = p.title || '';
    $('sheetBrand').textContent = `${p.brand || ''} · ${p.category || 'Mỹ phẩm'}`;

    renderSheetDetails();
    $('overlay').classList.add('show');
    $('sheet').classList.add('show');
    document.body.classList.add('lock');

    // Nếu phân loại đầu tiên chưa có SKU, tự động gọi cấp SKU
    const v = (curProduct.variants || [])[0];
    if (!v?.sku || !String(v.sku).trim()) {
      await ensureCurrentVariantSku();
    }
  }

  function closeSheet() {
    $('overlay').classList.remove('show');
    $('sheet').classList.remove('show');
    document.body.classList.remove('lock');
    curMode = null;
  }

  function renderSheetDetails() {
    const p = curProduct;
    if (!p) return;
    const vars = p.variants || [];
    const v = vars[curVariantIdx] || {};

    $('variantRow').innerHTML = vars.map((entry, idx) => `
      <button type="button" class="variant-btn ${idx === curVariantIdx ? 'active' : ''}" data-idx="${idx}">
        <span style="font-size:11px;font-weight:750;display:block;">${esc(entry.name || 'Mặc định')}</span>
        <span style="font-size:10px;color:#8893a2;display:block;margin-top:3px;">${esc(entry.sku || 'Chưa có SKU')} · tồn ${entry.stock || 0}</span>
      </button>
    `).join('');

    const jpy = parseInt(v.purchase_price_jpy) || 0;
    const cogs = jpy * RATE;
    const stock = parseInt(v.stock) || 0;
    const min = getMinStock(v);
    const st = getStockStatus(v);

    if (v.sku && String(v.sku).trim()) {
      $('skuBadge').innerHTML = `🏷 ${esc(v.sku)}`;
    } else {
      $('skuBadge').innerHTML = `
        <span>🏷 Chưa có SKU</span>
        <button type="button" onclick="window.forceGenerateSku()" style="margin-left:8px;padding:3px 8px;border-radius:6px;border:none;background:#f67823;color:#fff;font-size:10px;font-weight:700;cursor:pointer;">⚡ Cấp SKU ngay</button>
      `;
    }

    let stHtml = '';
    if (st === 'good') stHtml = '<span class="status-pill good">Còn hàng</span>';
    else if (st === 'low') stHtml = `<span class="status-pill low">Sắp hết hàng</span> <span class="status-pill low">Cần nhập hàng</span>`;
    else stHtml = `<span class="status-pill out">Hết hàng</span> <span class="status-pill out">Cần nhập hàng</span>`;
    $('skuTags').innerHTML = stHtml;

    $('yenVal').textContent = jpy ? `¥${fmt(jpy)}` : '—';
    $('cogsVal').textContent = jpy ? `${fmt(cogs)} đ` : '—';
    $('stockVal').textContent = fmt(stock);
    $('minVal').textContent = fmt(min);

    if (curMode === 'edit') showEditForm();
    if (curMode === 'receive') showReceiveForm();
  }

  function showEditForm() {
    curMode = 'edit';
    const v = curProduct.variants[curVariantIdx] || {};
    $('editArea').classList.remove('hidden');
    $('editTitle').textContent = 'Chỉnh sửa SKU · ' + (v.name || 'Mặc định');
    $('editGrid').innerHTML = `
      <div class="field"><label>Giá nhập (¥)</label><input id="fYen" type="number" min="0" value="${v.purchase_price_jpy || 0}"/></div>
      <div class="field"><label>Tồn kho</label><input id="fStock" type="number" min="0" value="${v.stock || 0}"/></div>
      <div class="field" style="grid-column:1/-1;"><label>Ngưỡng cảnh báo</label><input id="fMin" type="number" min="0" value="${getMinStock(v)}"/></div>
    `;
    updateCalc();
    $('fYen').addEventListener('input', updateCalc);
    $('saveBtn').textContent = 'Lưu thay đổi';
  }

  function showReceiveForm() {
    curMode = 'receive';
    const v = curProduct.variants[curVariantIdx] || {};
    $('editArea').classList.remove('hidden');
    $('editTitle').textContent = 'Nhập thêm vào kho · ' + (v.name || 'Mặc định');
    $('editGrid').innerHTML = `
      <div class="field"><label>Tồn kho hiện tại</label><input type="text" value="${v.stock || 0}" readonly style="background:#f0f2f5;"/></div>
      <div class="field"><label>Số lượng nhận thêm</label><input id="fReceive" type="number" min="1" value="1"/></div>
    `;
    const jpy = parseInt(v.purchase_price_jpy) || 0;
    $('computed').innerHTML = `<span>Giá vốn / sản phẩm</span><b>${fmt(jpy * RATE)} đ</b>`;
    $('saveBtn').textContent = 'Xác nhận nhập kho';
  }

  function updateCalc() {
    const yen = Number($('fYen')?.value) || 0;
    $('computed').innerHTML = `<span>Giá vốn VND (¥ × 170)</span><b>${fmt(yen * RATE)} đ</b>`;
  }

  async function executeSave() {
    if (isSaving || !curProduct) return;
    let v = curProduct.variants[curVariantIdx] || {};

    // Nếu chưa có SKU thì tự động cấp trước khi gửi lệnh PATCH
    if (!v.sku || !String(v.sku).trim()) {
      const newSku = await ensureCurrentVariantSku();
      if (!newSku) {
        toast('❌ Không thể tự động cấp SKU. Vui lòng thử lại!');
        return;
      }
      v = curProduct.variants[curVariantIdx];
    }

    const payload = {
      product_id: curProduct.id,
      expected_etag: curProduct._etag,
      variant_index: curVariantIdx,
      sku: v.sku,
      action: curMode
    };

    if (curMode === 'receive') {
      const qty = parseInt($('fReceive').value);
      if (!qty || qty <= 0) return toast('Số lượng nhập phải lớn hơn 0');
      payload.receive_qty = qty;
    } else if (curMode === 'edit') {
      payload.purchase_price_jpy = parseInt($('fYen').value) || 0;
      payload.stock = parseInt($('fStock').value) || 0;
      payload.min_stock = parseInt($('fMin').value) || 0;
    }

    isSaving = true;
    $('saveBtn').disabled = true;
    $('saveBtn').textContent = 'Đang lưu vào Cosmos DB...';

    try {
      const res = await fetch('/api/manage/sku/update', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Lỗi lưu dữ liệu');

      toast('✓ ' + (data.message || 'Cập nhật thành công'));

      // Cập nhật state nội bộ
      if (curMode === 'receive') {
        v.stock = (parseInt(v.stock) || 0) + payload.receive_qty;
        if (v.stock > 0 && v.status === 'out') v.status = 'instock';
      } else {
        v.purchase_price_jpy = payload.purchase_price_jpy;
        v.stock = payload.stock;
        v.min_stock = payload.min_stock;
        if (v.stock === 0) v.status = 'out';
        else if (v.status === 'out' && v.stock > 0) v.status = 'instock';
      }
      curProduct._etag = data.etag || curProduct._etag;

      $('editArea').classList.add('hidden');
      curMode = null;
      renderSheetDetails();
      renderStats();
      renderGrid();
    } catch (err) {
      toast('❌ ' + err.message);
    } finally {
      isSaving = false;
      $('saveBtn').disabled = false;
    }
  }

  let toastTimer = null;
  function toast(msg) {
    document.querySelector('.toast')?.remove();
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 2500);
  }

  // Event Listeners
  $('q').addEventListener('input', renderGrid);
  $('filterBar').addEventListener('click', e => {
    const b = e.target.closest('.filter');
    if (!b) return;
    $('filterBar').querySelectorAll('.filter').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    filter = b.dataset.filter;
    renderGrid();
  });
  $('grid').addEventListener('click', e => {
    const card = e.target.closest('.product');
    if (!card) return;
    const p = rawProducts.find(x => x.id === card.dataset.id);
    if (p) openSheet(p);
  });
  $('variantRow').addEventListener('click', async e => {
    const b = e.target.closest('.variant-btn');
    if (!b) return;
    curVariantIdx = Number(b.dataset.idx);
    $('editArea').classList.add('hidden');
    curMode = null;
    renderSheetDetails();

    const v = (curProduct.variants || [])[curVariantIdx];
    if (!v?.sku || !String(v.sku).trim()) {
      await ensureCurrentVariantSku();
    }
  });
  $('close').addEventListener('click', closeSheet);
  $('overlay').addEventListener('click', closeSheet);
  $('editBtn').addEventListener('click', () => {
    showEditForm();
    $('editArea').scrollIntoView({ behavior: 'smooth' });
  });
  $('receiveBtn').addEventListener('click', () => {
    showReceiveForm();
    $('editArea').scrollIntoView({ behavior: 'smooth' });
  });
  $('saveBtn').addEventListener('click', executeSave);
  $('layoutToggle').addEventListener('click', () => {
    const isTwo = $('grid').classList.toggle('two');
    $('layoutToggle').textContent = isTwo ? '▦' : '▤';
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeSheet();
  });

  loadData();
})();
</script>
</body>
</html>
